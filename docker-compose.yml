services:
    mariadb:
        image: mariadb:11.8.3
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_uca1400_ai_ci
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: directus
        ports:
            - 5102:3306
        volumes:
            - ./mariadb_data:/var/lib/mysql
    directus:
        image: directus/directus:11.12.0
        ports:
            - 8055:8055
        volumes:
            - ./uploads:/directus/uploads
            - ./extensions:/directus/extensions
            - ./snapshots:/directus/snapshots
        environment:
            KEY: "2985a8f6-aba3-45ab-8c1b-f36599896125"
            SECRET: "Xmakb8JqJNCqPZsybNL3RHOsMxrPMwX-"
            ADMIN_EMAIL: "admin@example.com"
            ADMIN_PASSWORD: "pass"
            DB_CLIENT: "mysql"
            DB_HOST: "mariadb"
            DB_PORT: "3306"
            DB_DATABASE: "directus"
            DB_USER: "root"
            DB_PASSWORD: "secret"
            WEBSOCKETS_ENABLED: "true"
            EXTENSIONS_AUTO_RELOAD: true
            DIRECTUS_EXTENSIONS_PATH: /directus/extensions/
