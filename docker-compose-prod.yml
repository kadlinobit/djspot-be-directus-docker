services:
  directus:
    ports:
      - 8055:8055
    image: 'directus/directus:11.17.2'
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
      - ./snapshots:/directus/snapshots
    environment:
      - SERVICE_URL_DIRECTUS_8055
      - KEY=${SERVICE_BASE64_64_KEY}
      - SECRET=${SERVICE_BASE64_64_SECRET}
      - ADMIN_EMAIL=${DIRECTUS_EMAIL_ADMIN:-admin@example.com}
      - ADMIN_PASSWORD=${DIRECTUS_PASSWORD_ADMIN:-pass}
      - DB_CLIENT=pg
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-directus}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WEBSOCKETS_ENABLED=true
    healthcheck:
      test:
        - CMD
        - wget
        - '-q'
        - '--spider'
        - 'http://127.0.0.1:8055/admin/login'
      interval: 5s
      timeout: 20s
      retries: 10
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    image: 'postgis/postgis:16-3.4'
    volumes:
      - 'directus-postgres-data:/var/lib/postgresql/data'
    environment:
      - 'POSTGRES_USER=${DB_USER}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_DB=${DB_DATABASE:-directus}'
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-U'
        - '${DB_USER}'
        - '-d'
        - '${DB_DATABASE:-directus}'
      interval: 5s
      timeout: 20s
      retries: 10

  redis:
    image: 'redis:7-alpine'
    command: 'redis-server --appendonly yes'
    volumes:
      - 'directus-redis-data:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 20s
      retries: 10

  schema-applier:
    image: 'directus/directus:11.17.2'
    restart: "no"
    volumes:
      - ./snapshots:/directus/snapshots
      - ./directus-config:/directus/directus-config
      - ./directus-sync.config.js:/directus/directus-sync.config.js
    environment:
      - DB_CLIENT=pg
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-directus}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_EMAIL=${DIRECTUS_EMAIL_ADMIN:-admin@example.com}
      - ADMIN_PASSWORD=${DIRECTUS_PASSWORD_ADMIN:-pass}
    command: >
      sh -c '
      npx directus schema apply --yes ./snapshots/latest-schema.yaml &&
      npx -y directus-sync --directus-url http://directus:8055 --directus-email $$ADMIN_EMAIL --directus-password $$ADMIN_PASSWORD --config-path ./directus-sync.config.cjs push --force --no-snapshot
      '
    depends_on:
      directus:
        condition: service_healthy
